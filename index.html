<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourtOS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <h1>CourtOS</h1>

    <p class="subtitle">
      AI Basketball Training Platform
    </p>

    <button id="uploadButton">
      Upload Shooting Video
    </button>

    <input
      type="file"
      id="videoInput"
      accept="video/*"
      hidden
    >

    <div id="videoInfo" hidden>
  <p>File: <span id="fileName"></span></p>
  <p>Size: <span id="fileSize"></span></p>
  <p>Duration: <span id="videoDuration"></span></p>
  <p>Resolution: <span id="videoResolution"></span></p>
</div>

<video
  id="videoPreview"
  controls
  hidden
></video>
<button id="analyzeButton" hidden>
  Analyze Shot
</button>

<section id="analysisResults" hidden>
  <h2>Analysis Results</h2>

  <p>Elbow Angle: <span id="elbowAngle">--</span></p>
  <p>Knee Angle: <span id="kneeAngle">--</span></p>
  <p>Body Lean: <span id="bodyLean">--</span></p>
  <p>Release Height: <span id="releaseHeight">--</span></p>

  <h3>
    Overall Score:
    <span id="overallScore">--</span>
  </h3>
</section>
  </main>

  <script src="script.js"></script>

</body>
</html>
